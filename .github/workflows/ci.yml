name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Build once: vsce package runs vscode:prepublish (npm run build), so packaging doubles
      # as the job's only build, and the integration steps below reuse that dist/.
      - name: Package smoke test (builds dist)
        run: npx vsce package --allow-missing-repository
      - name: Integration tests (Linux under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration:run
      - name: Integration tests on the minimum engine, VS Code 1.101.0 (Linux under Xvfb)
        if: runner.os == 'Linux'
        env:
          PERSONAS_IT_VSCODE_VERSION: 1.101.0
        run: xvfb-run -a npm run test:integration:run
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration:run
      # Windows on the minimum engine: Node 22.15.1 there reports a different lstat dev than
      # fstat, which once broke workspace-local manifest reads and does not reproduce on Linux.
      - name: Integration tests on the minimum engine, VS Code 1.101.0 (Windows)
        if: runner.os == 'Windows'
        env:
          PERSONAS_IT_VSCODE_VERSION: 1.101.0
        run: npm run test:integration:run
