# Dependabot version updates. Docs:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Only ecosystems that actually exist in this repo: npm (root package.json,
# devDependencies only — the extension ships zero runtime deps) and the
# GitHub Actions used by CI. Updates are grouped into one weekly PR per
# ecosystem to keep churn low; a future runtime dependency would fall
# outside the dev-dependency group and get its own PR for closer review.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dev-dependencies:
        dependency-type: "development"
    ignore:
      # VS Code API types must describe the minimum supported engine (1.90),
      # not the newest editor. Upgrade both together after compatibility review;
      # packaging rejects a newer @types/vscode than engines.vscode.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The extension host of the minimum supported engine runs Node.js 20.9.0
      # (VS Code 1.90). @types/node stays on 22, not 20, because vitest 5 declares an
      # optional peer of @types/node ^22.0.0 || >=24.0.0, and ^20 breaks `npm install`
      # with ERESOLVE. So typechecking will not catch Node 22-only APIs; avoid them.
      # Hold the major here and revisit when raising the minimum VS Code engine.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
