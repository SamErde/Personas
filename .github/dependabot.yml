# Dependabot version updates. Docs:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Only ecosystems that actually exist in this repo: npm (root package.json,
# devDependencies only — the extension ships zero runtime deps) and the
# GitHub Actions used by CI. Updates are grouped into one weekly PR per
# ecosystem to keep churn low; a future runtime dependency would fall
# outside the dev-dependency group and get its own PR for closer review.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dev-dependencies:
        dependency-type: "development"
    ignore:
      # VS Code API types must describe the minimum supported engine (1.101),
      # not the newest editor. Upgrade both together after compatibility review;
      # packaging rejects a newer @types/vscode than engines.vscode.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @types/node tracks the extension-host runtime of the minimum supported
      # engine: VS Code 1.101 runs its extension host on Node.js 22
      # (https://code.visualstudio.com/updates/v1_101). Newer types
      # would let code typecheck against Node APIs the host doesn't have. Bump the
      # major only when raising the minimum VS Code engine to a release on a newer
      # Node major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
